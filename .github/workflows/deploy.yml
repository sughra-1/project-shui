name: Deploy exam-shui to s3

on:
    push:
      branches:
        - main
permissions:
    id-token: write
    contents: read

jobs:
      deploy:
          runs-on: ubuntu-latest
          defaults:
            run:
              working-directory: shui-frontend   # run all commands in the frontend folder

          steps:
              - name: Checkout repository
                uses: actions/checkout@v4

              - name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                  node-version: 22

              - name: Install dependencies
                run: npm ci

              - name: Build application
                run: npm run build

              - name: Configure AWS credentials
                uses: aws-actions/configure-aws-credentials@v5
                with:
                  role-to-assume: arn:aws:iam::202991357567:role/project-shuis3frontenddeployrole
                  aws-region: eu-north-1

              - name: Deploy to s3
                run: aws s3 sync dist/ s3://project-shui-sughra --delete